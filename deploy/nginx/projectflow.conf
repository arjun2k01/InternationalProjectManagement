# Nginx configuration for ProjectFlow backend running on a VM.
# This setup:
# - Redirects HTTP traffic to HTTPS
# - Proxies REST API traffic to Node.js on port 5000
# - Preserves WebSocket upgrades for Socket.IO
# - Enables gzip compression
# - Adds common security headers

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream projectflow_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.projectflow.example.com;

    # Allow Certbot HTTP-01 validation requests through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.projectflow.example.com;

    # Let's Encrypt certificate paths managed by Certbot.
    ssl_certificate /etc/letsencrypt/live/api.projectflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.projectflow.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.projectflow.example.com/chain.pem;

    # Conservative TLS settings for modern browsers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Basic hardening headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compress common API response types.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    client_max_body_size 10m;

    # Shared proxy headers for upstream requests.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Socket.IO needs WebSocket upgrade support and long timeouts.
    location /socket.io/ {
        proxy_pass http://projectflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # REST API traffic goes to the same backend process.
    location /api/ {
        proxy_pass http://projectflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Optionally proxy any remaining requests to the backend as well.
    # This is useful for health checks or future backend-served endpoints.
    location / {
        proxy_pass http://projectflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
