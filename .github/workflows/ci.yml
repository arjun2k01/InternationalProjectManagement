name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build-backend:
    name: Lint and Build Backend
    runs-on: ubuntu-latest

    steps:
      # Pull the repository contents into the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Standardize all CI jobs on Node.js 18.
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install backend dependencies using npm install (package-lock.json is not present as bun is used locally).
      - name: Install backend dependencies
        working-directory: server
        run: npm install

      # Lint the backend codebase.
      - name: Run ESLint
        working-directory: server
        run: npm run lint

      # Run a backend build if one exists; otherwise perform a syntax check.
      - name: Run backend build check
        working-directory: server
        shell: bash
        run: |
          if [ "$(node -p "Boolean(require('./package.json').scripts.build)")" = "true" ]; then
            npm run build
          else
            node --check server.js
            find src -name "*.js" -print0 | xargs -0 -n1 node --check
          fi

  lint-and-build-frontend:
    name: Lint and Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Pull the repository contents into the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Standardize all CI jobs on Node.js 18.
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install frontend dependencies using npm install (package-lock.json is not present).
      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      # Lint the frontend codebase.
      - name: Run ESLint
        working-directory: client
        run: npm run lint

      # Produce a production frontend build.
      - name: Run frontend build
        working-directory: client
        run: npm run build

  deploy-backend:
    name: Deploy Backend
    needs:
      - lint-and-build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Trigger Render deployment using a service deploy hook secret.
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Deploy Frontend
    needs:
      - lint-and-build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Trigger Vercel production deployment using a project deploy hook.
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_HOOK_URL"
